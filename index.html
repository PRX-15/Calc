<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0b0b0d"
    >

    <title>Calc</title>

<link
    rel="stylesheet"
    href="style.css"
>
    <link rel="manifest"
      href="manifest.json">
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header>

        <div>
            <div class="brand">
                CALC
            </div>

            <div class="subtitle">
                Simple. Fast. Yours.
            </div>
        </div>


        <div class="header-actions">

            <button
    type="button"
    class="round-button theme-toggle"
    id="themeButton"
    aria-label="Toggle theme"
>
    <img
        src="images/dark-toggle.png"
        alt=""
        class="theme-toggle-icon dark-toggle-icon"
    >

    <img
        src="images/light-toggle.png"
        alt=""
        class="theme-toggle-icon light-toggle-icon"
    >
</button>

            <button
    type="button"
    class="round-button"
    id="historyButton"
    aria-label="Open history"
>
    <img
        src="HistoryButton.png"
        alt=""
        class="history-icon"
    >
</button>

        </div>

    </header>


    <!-- CALCULATOR -->

    <main class="calculator">

        <!-- DISPLAY -->

        <section class="display-card">
             <button
    type="button"
    class="copy-result"
    id="copyResult"
    aria-label="Copy result"
>
    ⧉
</button>

<div
    id="copyToast"
    class="copy-toast"
    aria-live="polite"
>
    Copied!
</div>

            <div id="expressionPreview"></div>

            <input
    id="display"
    type="text"
    inputmode="none"
    autocomplete="off"
    autocorrect="off"
    spellcheck="false"
    value="0"
    aria-label="Calculator display"
>
   <div
    id="liveResult"
    class="live-result"
    aria-live="polite"
></div>

        </section>


        <!-- BUTTONS -->

        <section
            class="buttons"
            aria-label="Calculator buttons"
        >

            <!-- ROW 1 -->

<button
    type="button"
    class="utility"
    onclick="clearDisplay()"
>
    AC
</button>

<button
    type="button"
    class="utility"
    onclick="deleteLast()"
>
    ⌫
</button>

<button
    type="button"
    class="utility"
    onclick="percentage()"
>
    %
</button>

<button
    type="button"
    class="utility"
    onclick="squareRoot()"
>
    √
</button>


<!-- ROW 2 -->

<button
    type="button"
    class="utility"
    onclick="toggleSign()"
>
    ±
</button>

<button
    type="button"
    class="operator"
    onclick="append('(')"
>
    (
</button>

<button
    type="button"
    class="operator"
    onclick="append(')')"
>
    )
</button>

<button
    type="button"
    class="operator"
    onclick="append('/')"
>
    ÷
</button>


<!-- ROW 3 -->

<button
    type="button"
    onclick="append('7')"
>
    7
</button>

<button
    type="button"
    onclick="append('8')"
>
    8
</button>

<button
    type="button"
    onclick="append('9')"
>
    9
</button>

<button
    type="button"
    class="operator"
    onclick="append('*')"
>
    ×
</button>


<!-- ROW 4 -->

<button
    type="button"
    onclick="append('4')"
>
    4
</button>

<button
    type="button"
    onclick="append('5')"
>
    5
</button>

<button
    type="button"
    onclick="append('6')"
>
    6
</button>

<button
    type="button"
    class="operator"
    onclick="append('-')"
>
    -
</button>


<!-- ROW 5 -->

<button
    type="button"
    onclick="append('1')"
>
    1
</button>

<button
    type="button"
    onclick="append('2')"
>
    2
</button>

<button
    type="button"
    onclick="append('3')"
>
    3
</button>

<button
    type="button"
    class="operator"
    onclick="append('+')"
>
    +
</button>


<!-- ROW 6 -->

<button
    type="button"
    class="zero"
    onclick="append('0')"
>
    0
</button>

<button
    type="button"
    onclick="append('.')"
>
    .
</button>

<button
    type="button"
    class="equals"
    onclick="calculate()"
>
    =
</button>

        </section>

    </main>

</div>


<!-- =========================
     HISTORY
========================= -->

<div
    id="historyOverlay"
    class="history-overlay"
    aria-hidden="true"
>

    <aside
        class="history-panel"
        role="dialog"
        aria-modal="true"
        aria-label="Calculation history"
    >

        <div class="history-head">

            <div>

                <div class="panel-title">
                    History
                </div>

                <div class="panel-subtitle">
                    Your recent calculations
                </div>

            </div>


            <button
                type="button"
                class="close-button"
                id="closeHistory"
                aria-label="Close history"
            >
                ×
            </button>

        </div>


        <div
            id="historyList"
            class="history-list"
        ></div>


        <button
            type="button"
            class="clear-history"
            id="clearHistory"
        >
            Clear history
        </button>

    </aside>

</div>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
        try {
            const registration = await navigator.serviceWorker.register(
                "./sw.js",
                { updateViaCache: "none" }
            );

            await registration.update();
        } catch (error) {
            console.error("Service worker registration failed:", error);
        }
    });
}
</script>

<script src="script.js"></script>

</body>
</html>
